name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python: ["3.9", "3.11"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m zipfile -l $archive.FullName
